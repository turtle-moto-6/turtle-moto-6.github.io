<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти - Turtle Moto 6</title>
    <style>
        :root {
            --primary: #ff6600;
            --dark: #1a1a1a;
            --light: #f4f4f4;
            --text-light: #ffffff;
            --text-dark: #333333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--light);
            color: var(--text-dark);
            line-height: 1.6;
        }
        header {
            background: var(--dark);
            color: var(--text-light);
            padding: 20px 0;
            border-bottom: 4px solid var(--primary);
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .logo {
            color: var(--text-light);
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
        .logo span { color: var(--primary); }
        nav a, .back-link {
            color: var(--text-light);
            text-decoration: none;
        }
        nav a:hover, .back-link:hover { color: var(--primary); }
        main { padding: 60px 0; }
        .contact-card {
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 4px solid var(--primary);
        }
        h1 { margin: 20px 0 12px; }
        .contact-card > p { margin-bottom: 24px; }
        .contact-item { margin-top: 16px; }
        .contact-item strong { display: block; }
        .contact-item a { color: #c94f00; }
        .contact-item a:hover { color: #963b00; }
        @media (max-width: 520px) {
            .header-content { align-items: flex-start; flex-direction: column; }
            .contact-card { padding: 24px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">Turtle Moto <span>6</span></a>
            <nav><a href="index.html">← Начало</a></nav>
        </div>
    </header>
    <main class="container">
        <section class="contact-card">
            <a href="index.html" class="back-link" style="color: #333;">← Всички услуги</a>
            <h1>Свържете се с нас</h1>
            <p>Пишете ни за цени, наличност или въпроси относно нашите услуги.</p>
            <div class="contact-item">
                <strong>Facebook</strong>
                <a href="https://www.facebook.com/profile.php?id=61594601897443" target="_blank" rel="noopener noreferrer">Посетете нашата страница</a>
            </div>
            <div class="contact-item">
                <strong>Локация</strong>
                <span>България, Пловдив</span>
            </div>
        </section>
    </main>
</body>
</html>
